openapi: 3.0.3
info:
  title: Text-to-SQL Service API
  version: 1.0.0
  description: |
    Contract for the Text-to-SQL service.

    Note:
    - This contract mirrors the module response models.
    - HTTP status mapping can be customized by the outer backend layer.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
  /txt-to-sql:
    post:
      summary: Generate validated SQL from natural-language text
      operationId: runTxtToSql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextToSQLRequest'
            examples:
              basic:
                value:
                  question: List product id and name
                  db_type: postgres
                  role_schema:
                    products:
                      id: INT
                      name: TEXT
      responses:
        '200':
          description: SQL generated and validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToSQLSuccess'
              examples:
                success:
                  value:
                    status: success
                    sql: SELECT products.id, products.name FROM products
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToSQLError'
              examples:
                invalid_request:
                  value:
                    status: error
                    error_code: INVALID_REQUEST
                    error_subcode: PAYLOAD_VALIDATION
                    message: Question must contain at least 3 words.
        '422':
          description: SQL generated but rejected by validator policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToSQLError'
              examples:
                sql_rejected:
                  value:
                    status: error
                    error_code: SQL_REJECTED
                    error_subcode: WILDCARD_SELECT
                    message: Wildcard '*' is not allowed; select explicit columns
        '502':
          description: Upstream model generation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToSQLError'
              examples:
                generation_failed:
                  value:
                    status: error
                    error_code: GENERATION_FAILED
                    error_subcode: PROVIDER_FAILURE
                    message: Gemini generation failed: ServerError
        '500':
          description: Unexpected internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToSQLError'
              examples:
                internal_error:
                  value:
                    status: error
                    error_code: INTERNAL_ERROR
                    error_subcode: UNEXPECTED_EXCEPTION
                    message: Unexpected error: RuntimeError
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    TextToSQLRequest:
      type: object
      required:
        - question
        - db_type
        - role_schema
      properties:
        question:
          type: string
          description: Natural language question from the user.
          minLength: 1
        db_type:
          type: string
          description: Target database dialect.
          enum:
            - postgres
            - mysql
            - sqlserver
        role_schema:
          type: object
          description: "RBAC-sliced schema in the form {table: {column: type}}."
          minProperties: 1
          additionalProperties:
            type: object
            minProperties: 1
            additionalProperties:
              type: string

    TextToSQLSuccess:
      type: object
      required:
        - status
        - sql
      properties:
        status:
          type: string
          enum:
            - success
        sql:
          type: string

    TextToSQLError:
      type: object
      required:
        - status
        - error_code
        - message
      properties:
        status:
          type: string
          enum:
            - error
        error_code:
          type: string
          enum:
            - INVALID_REQUEST
            - GENERATION_FAILED
            - SQL_REJECTED
            - INTERNAL_ERROR
        error_subcode:
          type: string
          nullable: true
          description: Specific reason within an error_code.
          enum:
            - PAYLOAD_VALIDATION
            - PAYLOAD_TYPE
            - MISSING_API_KEY
            - CLIENT_INIT_FAILED
            - PROMPT_EMPTY
            - PROVIDER_FAILURE
            - INVALID_RESPONSE_TYPE
            - EMPTY_RESPONSE
            - EMPTY_SQL
            - PARSE_ERROR
            - MULTI_STATEMENT
            - MARKDOWN_OR_COMMENTS
            - NON_SELECT_QUERY
            - SELECT_INTO
            - WILDCARD_SELECT
            - SELECT_WITHOUT_FROM
            - UNION_NOT_SUPPORTED
            - RECURSIVE_CTE
            - SCHEMA_QUALIFIED_FUNCTION
            - UNKNOWN_FUNCTION
            - FUNCTION_NOT_ALLOWED
            - TABLE_NAME_MISSING
            - SYSTEM_SCHEMA_ACCESS
            - TABLE_NOT_ALLOWED
            - UNAUTHORIZED_TABLE_ACCESS
            - UNAUTHORIZED_COLUMN_ACCESS
            - UNRESOLVED_COLUMN
            - SCHEMA_RESOLUTION_ERROR
            - UNEXPECTED_EXCEPTION
            - UNKNOWN
        message:
          type: string

    TextToSQLResponse:
      oneOf:
        - $ref: '#/components/schemas/TextToSQLSuccess'
        - $ref: '#/components/schemas/TextToSQLError'
      discriminator:
        propertyName: status
        mapping:
          success: '#/components/schemas/TextToSQLSuccess'
          error: '#/components/schemas/TextToSQLError'
